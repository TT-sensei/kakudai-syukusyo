name: Badge browser test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  badge-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright in temporary folder
        run: npm install --prefix "$RUNNER_TEMP/tt-playwright" playwright
      - name: Install Chromium
        run: "$RUNNER_TEMP/tt-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test the published badge system in Chromium
        env:
          BASE_URL: https://tt-sensei.github.io/kakudai-syukusyo/
          NODE_PATH: ${{ runner.temp }}/tt-playwright/node_modules
        run: node tests/badge-e2e.cjs
